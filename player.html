<html>
<head>
<meta charset="utf-8">
<link rel='stylesheet' href='https://use.fontawesome.com/releases/v5.3.1/css/all.css'>
<style>
*:focus { outline: none; }

body {
  font-family: Helvetica, Arial;
  margin: 0;
  min-height: 240px;
  background-color: #fff;
  overflow: hidden;
}

#app-cover {
  position: relative;
  width: 430px;
  height: 100px;
  margin: 90px auto 0 auto;
  z-index: 3;
}

/* 배경 이미지 두 장을 겹쳐두고 번갈아 페이드시킵니다 */
.bg-artwork {
  position: fixed;
  top: -30px;
  right: -30px;
  bottom: -30px;
  left: -30px;
  background-color: #fff;
  background-repeat: no-repeat;
  background-size: cover;
  background-position: 50%;
  filter: blur(40px);
  -webkit-filter: blur(40px);
  opacity: 0;
  transition: opacity 1.6s ease;
  z-index: 1;
}

.bg-artwork.showing { opacity: 1; }

#bg-layer {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background-color: #fff;
  opacity: 0.51;
  z-index: 2;
}

#player { position: relative; height: 100%; z-index: 3; }

#player-track {
  position: absolute;
  top: 0;
  right: 15px;
  left: 15px;
  padding: 13px 22px 10px 184px;
  background-color: #fff8e7;
  border-radius: 15px 15px 0 0;
  transition: 0.3s ease top;
  z-index: 1;
}

#player-track.active { top: -92px; }

#album-name { color: #54576f; font-size: 17px; font-weight: bold; }
#track-name { color: #acaebd; font-size: 13px; margin: 2px 0 13px 0; }

#track-time { height: 12px; margin-bottom: 3px; overflow: hidden; }
#current-time { float: left; }
#track-length { float: right; }

#current-time, #track-length {
  color: transparent;
  font-size: 11px;
  background-color: #ffe8ee;
  border-radius: 10px;
  transition: 0.3s ease all;
}

#track-time.active #current-time,
#track-time.active #track-length {
  color: #cfb997;
  background-color: transparent;
}

#s-area, #seek-bar { position: relative; height: 4px; border-radius: 4px; }
#s-area { background-color: #E6E6E6; cursor: pointer; }

#ins-time {
  position: absolute;
  top: -29px;
  color: #fff;
  font-size: 12px;
  white-space: pre;
  padding: 5px 6px;
  border-radius: 4px;
  display: none;
}

#s-hover { position: absolute; top: 0; bottom: 0; left: 0; opacity: 0.2; z-index: 2; }
#ins-time, #s-hover { background-color: #3b3d50; }

#seek-bar {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: 0;
  width: 0;
  background-color: #cfb997;
  transition: 0.2s ease width;
  z-index: 1;
}

#player-content {
  position: relative;
  height: 100%;
  background-color: #fff;
  box-shadow: 0 30px 30px #E6E6E6;
  border-radius: 10px;
  z-index: 2;
}

#album-art {
  position: absolute;
  top: -40px;
  width: 115px;
  height: 115px;
  margin-left: 40px;
  transform: rotateZ(0);
  transition: 0.3s ease all;
  box-shadow: 0 0 0 10px #fff;
  border-radius: 50%;
  overflow: hidden;
}

#album-art.active {
  top: -60px;
  box-shadow: 0 0 0 4px #fff7f7, 0 30px 50px -15px #afb7c1;
}

#album-art:before {
  content: "";
  position: absolute;
  top: 50%; right: 0; left: 0;
  width: 20px; height: 20px;
  margin: -10px auto 0 auto;
  background-color: #d6dee7;
  border-radius: 50%;
  box-shadow: inset 0 0 0 2px #fff;
  z-index: 2;
}

#album-art img {
  display: block;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  z-index: -1;
}

#album-art img.active { opacity: 1; z-index: 1; }

#album-art.active img.active {
  z-index: 1;
  animation: rotateAlbumArt 3s linear 0s infinite forwards;
}

@keyframes rotateAlbumArt {
  0% { transform: rotateZ(0); }
  100% { transform: rotateZ(360deg); }
}

#buffer-box {
  position: absolute;
  top: 50%; right: 0; left: 0;
  height: 13px;
  color: #1f1f1f;
  font-size: 13px;
  font-family: Helvetica;
  text-align: center;
  font-weight: bold;
  line-height: 1;
  padding: 6px;
  margin: -12px auto 0 auto;
  background-color: rgba(255, 255, 255, 0.19);
  opacity: 0;
  z-index: 3;
}

#album-art img, #buffer-box { transition: 0.1s linear all; }
#album-art.buffering img { opacity: 0.25; }
#album-art.buffering img.active { opacity: 0.8; filter: blur(2px); -webkit-filter: blur(2px); }
#album-art.buffering #buffer-box { opacity: 1; }

#player-controls {
  width: 250px;
  height: 100%;
  margin: 0 5px 0 141px;
  float: right;
  overflow: hidden;
}

.control { width: 33.333%; float: left; padding: 12px 0; }

.button {
  width: 26px; height: 26px;
  padding: 25px;
  background-color: #fff;
  border-radius: 6px;
  cursor: pointer;
}

.button i { display: block; color: #d6dee7; font-size: 26px; text-align: center; line-height: 1; }
.button, .button i { transition: 0.2s ease all; }
.button:hover { background-color: #d6d6de; }
.button:hover i { color: #fff; }
.button.disabled { pointer-events: none; opacity: 0.35; }
</style>
</head>
<body>

<div class="bg-artwork" id="bg-a"></div>
<div class="bg-artwork" id="bg-b"></div>
<div id="bg-layer"></div>

<div id="app-cover">
  <div id="player">
    <div id="player-track">
      <div id="album-name">불러오는 중</div>
      <div id="track-name">music 폴더를 읽고 있습니다</div>
      <div id="track-time">
        <div id="current-time"></div>
        <div id="track-length"></div>
      </div>
      <div id="s-area">
        <div id="ins-time"></div>
        <div id="s-hover"></div>
        <div id="seek-bar"></div>
      </div>
    </div>
    <div id="player-content">
      <div id="album-art">
        <div id="buffer-box">Buffering ...</div>
      </div>
      <div id="player-controls">
        <div class="control">
          <div class="button disabled" id="play-previous"><i class="fas fa-backward"></i></div>
        </div>
        <div class="control">
          <div class="button disabled" id="play-pause-button"><i class="fas fa-play"></i></div>
        </div>
        <div class="control">
          <div class="button disabled" id="play-next"><i class="fas fa-forward"></i></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
<script>
/* ============================================================
   설정
   ============================================================ */

var REPO   = "kmd384/my-notion-music";
var BRANCH = "main";

// 배경 이미지가 바뀌는 간격 (초)
var BG_INTERVAL = 15;

// 곡 제목을 예쁘게 보여주고 싶을 때만 적어주세요.
// 파일 이름을 그대로 키로 쓰면 됩니다. 안 적으면 파일 이름이 그대로 나옵니다.
var META = {
  "graceful-ghost.mp3": { album: "Graceful Ghost", artist: "W. Bolcom" },
  "white-beyond.mp3":   { album: "WHITE BEYOND",   artist: "岩崎太整" }
};

/* ============================================================
   아래는 건드리지 않아도 됩니다
   ============================================================ */

var audio = new Audio(),
    tracks = [],
    covers = [],
    currIndex = 0,
    bgIndex = 0,
    bgTimer = null,
    bgFlip = false,
    seekT = 0,
    seekLoc = 0;

var $bgA = $("#bg-a"),
    $bgB = $("#bg-b"),
    $playerTrack = $("#player-track"),
    $albumName = $("#album-name"),
    $trackName = $("#track-name"),
    $albumArt = $("#album-art"),
    $sArea = $("#s-area"),
    $seekBar = $("#seek-bar"),
    $trackTime = $("#track-time"),
    $insTime = $("#ins-time"),
    $sHover = $("#s-hover"),
    $playPause = $("#play-pause-button"),
    $icon = $playPause.find("i"),
    $progress = $("#current-time"),
    $length = $("#track-length"),
    $buttons = $(".button");

function api(path) {
  return "https://api.github.com/repos/" + REPO + "/contents/" + path + "?ref=" + BRANCH;
}

// 폴더 안의 파일 목록을 이름순으로 가져옵니다.
function listFolder(path, extensions) {
  return fetch(api(path))
    .then(function (r) {
      if (!r.ok) throw new Error(path + " " + r.status);
      return r.json();
    })
    .then(function (items) {
      return items
        .filter(function (i) {
          if (i.type !== "file") return false;
          var name = i.name.toLowerCase();
          return extensions.some(function (ext) { return name.endsWith(ext); });
        })
        .sort(function (a, b) { return a.name.localeCompare(b.name); })
        .map(function (i) {
          return {
            name: i.name,
            url: "https://raw.githubusercontent.com/" + REPO +
                 "/refs/heads/" + BRANCH + "/" + path + "/" +
                 encodeURIComponent(i.name)
          };
        });
}

function prettify(filename) {
  return filename.replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ").trim();
}

function fmt(sec) {
  if (isNaN(sec) || sec < 0) return "00:00";
  var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
}

/* ---------- 배경 ---------- */

function showBackground(url) {
  var $incoming = bgFlip ? $bgA : $bgB,
      $outgoing = bgFlip ? $bgB : $bgA;

  $incoming.css("background-image", "url('" + url + "')");
  $incoming.addClass("showing");
  $outgoing.removeClass("showing");
  bgFlip = !bgFlip;
}

function nextBackground() {
  if (!covers.length) return;
  bgIndex = (bgIndex + 1) % covers.length;
  showBackground(covers[bgIndex].url);
}

function startBackgroundLoop() {
  if (!covers.length) return;
  bgIndex = 0;
  showBackground(covers[0].url);
  clearInterval(bgTimer);
  if (covers.length > 1) bgTimer = setInterval(nextBackground, BG_INTERVAL * 1000);
}

/* ---------- 재생 ---------- */

function paintTrack(idx) {
  var t = tracks[idx],
      meta = META[t.name] || {};

  $albumName.text(meta.album || prettify(t.name));
  $trackName.text(meta.artist || "");

  $albumArt.find("img.active").removeClass("active");
  $("#art-" + idx).addClass("active");

  $seekBar.width(0);
  $trackTime.removeClass("active");
  $progress.text("00:00");
  $length.text("00:00");
}

function loadTrack(idx, autoplay) {
  currIndex = idx;
  paintTrack(idx);
  audio.src = tracks[idx].url;

  if (autoplay) {
    audio.play();
    $playerTrack.addClass("active");
    $albumArt.addClass("active");
  }
}

function playPause() {
  if (!tracks.length) return;

  if (audio.paused) {
    $playerTrack.addClass("active");
    $albumArt.addClass("active");
    $icon.attr("class", "fas fa-pause");
    audio.play();
  } else {
    $playerTrack.removeClass("active");
    $albumArt.removeClass("active").removeClass("buffering");
    $icon.attr("class", "fas fa-play");
    audio.pause();
  }
}

function step(dir) {
  if (!tracks.length) return;
  var next = (currIndex + dir + tracks.length) % tracks.length;
  loadTrack(next, true);
  $icon.attr("class", "fas fa-pause");
}

/* ---------- 이벤트 ---------- */

$(audio).on("timeupdate", function () {
  var dur = audio.duration || 0;
  if (!dur) return;

  $trackTime.addClass("active");
  $progress.text(fmt(audio.currentTime));
  $length.text(fmt(dur));
  $seekBar.width((audio.currentTime / dur) * 100 + "%");
});

$(audio).on("waiting", function () { $albumArt.addClass("buffering"); });
$(audio).on("playing", function () { $albumArt.removeClass("buffering"); });

$(audio).on("ended", function () { step(1); });

$(audio).on("error", function () {
  $albumName.text("이 곡을 불러오지 못했습니다");
  $trackName.text(tracks.length ? tracks[currIndex].name : "");
  $albumArt.removeClass("buffering");
});

$sArea.on("mousemove", function (e) {
  var dur = audio.duration || 0;
  if (!dur) return;

  var pos = $sArea.offset();
  seekT = e.clientX - pos.left;
  seekLoc = dur * (seekT / $sArea.outerWidth());

  $sHover.width(seekT);
  $insTime.text(fmt(seekLoc)).css({ left: seekT, "margin-left": "-21px" }).fadeIn(0);
});

$sArea.on("mouseout", function () {
  $sHover.width(0);
  $insTime.text("00:00").css({ left: "0px", "margin-left": "0px" }).fadeOut(0);
});

$sArea.on("click", function () {
  if (!audio.duration) return;
  audio.currentTime = seekLoc;
  $seekBar.width(seekT);
  $sHover.width(0);
  $insTime.fadeOut(0);
});

$playPause.on("click", playPause);
$("#play-previous").on("click", function () { step(-1); });
$("#play-next").on("click", function () { step(1); });

/* ---------- 시작 ---------- */

function fail(message, detail) {
  $albumName.text(message);
  $trackName.text(detail);
}

Promise.all([
  listFolder("music", [".mp3", ".m4a", ".ogg", ".wav"]),
  listFolder("cover", [".jpg", ".jpeg", ".png", ".gif", ".webp"]).catch(function () { return []; })
])
  .then(function (result) {
    tracks = result[0];
    covers = result[1];

    if (!tracks.length) {
      fail("music 폴더가 비어 있습니다", "mp3 파일을 올려주세요");
      return;
    }

    // 앨범 아트로 쓸 이미지를 트랙 수만큼 만듭니다.
    $.each(tracks, function (idx) {
      var art = covers.length ? covers[idx % covers.length].url : "";
      $("<img>").attr("src", art).attr("id", "art-" + idx).prependTo($albumArt);
    });

    startBackgroundLoop();
    loadTrack(0, false);
    $buttons.removeClass("disabled");
  })
  .catch(function (err) {
    fail("목록을 불러오지 못했습니다", String(err.message || err));
  });
</script>
</body>
</html>
